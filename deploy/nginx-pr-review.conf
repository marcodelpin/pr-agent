# Nginx config for pr-review.mdp
# ===============================
# Install on LXC 220 (infra-services-mdp)
#
# Copy to: /etc/nginx/sites-available/pr-review.mdp
# Enable:  ln -s /etc/nginx/sites-available/pr-review.mdp /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx

# Upstream - PR-Agent on mdp-gpu-wsl via Tailscale
upstream pr_review_backend {
    server 100.124.180.114:8080;
    keepalive 8;
}

# HTTP server (redirects to HTTPS)
server {
    listen 80;
    server_name pr-review.mdp pr-agent.mdp;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name pr-review.mdp pr-agent.mdp;

    # SSL certificates (same as other .mdp services)
    ssl_certificate /etc/nginx/ssl/mdp.crt;
    ssl_certificate_key /etc/nginx/ssl/mdp.key;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Timeouts for long-running LLM requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Max body size for large diffs
    client_max_body_size 10M;

    location / {
        proxy_pass http://pr_review_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering for LLM responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
    }

    # Health check endpoint (faster timeout)
    location /health {
        proxy_pass http://pr_review_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
